[project]
name = "cuenca-transit-planned-service-audit"
version = "0.1.0"
description = "Reproducible audit of Cuenca's planned public transit service using approved CKAN route and stop snapshots."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Optional local demo (read-only Streamlit app). Pinned so the demo extra
# resolves deterministically; it is not part of the base installation.
demo = [
    "streamlit==1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The renderer embeds long SVG attribute strings by design.
"scripts/render_p2_coordinate_quality.py" = ["E501"]
